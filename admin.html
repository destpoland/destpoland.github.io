<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Announcements</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin:auto; }
    input, textarea { width: 100%; padding: 8px; margin-bottom: 12px; border-radius: 4px; border: 1px solid #ccc; }
    button { padding: 10px 16px; border-radius: 6px; border: none; cursor: pointer; margin-right: 8px; }
    button.send { background-color: #2b6ef6; color: white; }
    button.clear { background-color: #f44336; color: white; }
    #loginForm { margin-bottom: 20px; }
  </style>
</head>
<body>

<h1>Admin Panel - Announcements</h1>

<!-- Simple password check for testing -->
<div id="loginForm">
  <input type="password" id="adminPass" placeholder="Enter admin password">
  <button id="loginBtn">Login</button>
</div>

<div id="adminUI" style="display:none;">
  <input id="title" placeholder="Announcement Title">
  <textarea id="message" placeholder="Announcement Message" rows="4"></textarea>
  <input id="duration" placeholder="Duration (seconds, optional)">
  <button class="send" id="sendBtn">Send Announcement</button>
  <button class="clear" id="clearBtn">Clear Announcement</button>
</div>

<script>
  // --------------------------
  // Firebase setup
  // --------------------------
  const firebaseConfig = {
	apiKey: "AIzaSyCnXJ7ViYIjukZjCQc2ZVM6TWRVik3YFsw",
	authDomain: "destpl-13f92.firebaseapp.com",
	databaseURL: "https://destpl-13f92-default-rtdb.firebaseio.com/", // <-- your DB URL
	projectId: "destpl-13f92",
	appId: "1:550261346575:web:51a155990b214563f92e7a"
	};
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // --------------------------
  // Simple admin login (client-side only, replace with proper auth for production)
  // --------------------------
  const ADMIN_PASSWORD = "carter&rover"; // change to your password
  const loginForm = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const adminUI = document.getElementById('adminUI');

  loginBtn.addEventListener('click', () => {
    const val = document.getElementById('adminPass').value;
    if(val === ADMIN_PASSWORD) {
      loginForm.style.display = 'none';
      adminUI.style.display = 'block';
    } else {
      alert('Incorrect password.');
    }
  });

  // --------------------------
  // Send announcement
  // --------------------------
  const sendBtn = document.getElementById('sendBtn');
  const clearBtn = document.getElementById('clearBtn');

  sendBtn.addEventListener('click', async () => {
    const title = document.getElementById('title').value.trim();
    const message = document.getElementById('message').value.trim();
    const duration = parseInt(document.getElementById('duration').value) || null;

    if(!message) return alert("Message cannot be empty.");

    const payload = {
      title,
      message,
      ts: Date.now(),
    };
    if(duration) payload.durationSeconds = duration;

    try {
      // Write to current announcement node
      await db.ref('announcements/current').set(payload);

      // Append to logs for audit
      await db.ref('announcements/logs').push(payload);

      alert("Announcement sent!");
    } catch (err) {
      console.error(err);
      alert("Failed to send announcement.");
    }
  });

  // --------------------------
  // Clear current announcement
  // --------------------------
  clearBtn.addEventListener('click', async () => {
    if(!confirm("Are you sure you want to clear the current announcement?")) return;
    try {
      await db.ref('announcements/current').remove();
      alert("Announcement cleared.");
    } catch(err) {
      console.error(err);
      alert("Failed to clear announcement.");
    }
  });
</script>

</body>
</html>
