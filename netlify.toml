[build]
  publish = "."  # your index.html is in the root
  functions = "netlify/functions"

# -------------------------
# Headers to prevent COEP / CORP warnings
# -------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Resource-Policy = "cross-origin"

# Optional: SPA redirect for single-page apps
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
