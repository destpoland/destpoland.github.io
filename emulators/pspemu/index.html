<!DOCTYPE html>
<html>
<head>
  <title>PSP Emulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body, html {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: monospace;
    }
    #display {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<script>
  // ask immediately for ISO URL
  async function askForISO() {
    let url = prompt("Enter direct PSP .iso URL:");

    // cancelled or empty
    if (!url) return askForISO();

    // basic validation
    if (!url.toLowerCase().endsWith(".iso")) {
      alert("URL must end with .iso");
      return askForISO();
    }

    startEmulator(url);
  }

  async function startEmulator(url) {
    // Remove everything in the body and create game display
    document.body.innerHTML = "";
    const wrap = document.createElement("div");
    wrap.id = "display";
    const game = document.createElement("div");
    game.id = "game";
    wrap.appendChild(game);
    document.body.appendChild(wrap);

    // EmulatorJS config
    window.EJS_player = "#game";
    window.EJS_gameName = url.split("/").pop();
    window.EJS_gameUrl = url;            // <-- URL STRAIGHT INTO THE EMULATOR
    window.EJS_core = "psp";
    window.EJS_pathtodata = "data/";
    window.EJS_startOnLoaded = true;
    window.EJS_threads = false;
    window.EJS_disableDatabases = true;

    // Load emulator loader script
    const script = document.createElement("script");
    script.src = "data/loader.js";
    document.body.appendChild(script);
  }

  askForISO();
</script>

</body>
</html>
