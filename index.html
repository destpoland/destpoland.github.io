<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="../manifest.json" />
  <title>destpl</title>

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="mobile.css" />

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>
    /* Announcement overlay styles */
    #announcementOverlay {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.75);
      color: white; z-index: 99999;
      padding: 20px; box-sizing: border-box;
    }
    #announcementOverlay.show { display:flex; }
    #announcementBox {
      max-width: 900px; width: 90%;
      background: rgba(0,0,0,0.6); padding: 24px;
      border-radius: 8px; text-align: center;
      box-shadow: 0 6px 30px rgba(0,0,0,0.6);
    }
    #announcementBox h2 { margin: 0 0 8px 0; font-size: 1.6rem; }
    #announcementBox p { margin: 0 0 12px 0; white-space: pre-wrap; }
    #announcementBox button { padding: 6px 12px; border-radius: 6px; border:none; cursor:pointer; background:#2b6ef6; color:#fff; }
  </style>
</head>
<body>
  <div class="animation-area">
    <ul class="box-area">
      <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>
  </div>

  <script src="./settings.js"></script>

  <div class="banner-text">
    <div class="bar">
      <img alt="Home" onclick="location.href='../'" src="./homeimgs/favicon.png" class="logo" draggable="false">
      <img alt="SRC" class="chatlogo" onclick="location.href='./settings/'" src="./homeimgs/settings.png" draggable="false">
      <h1>destpl</h1>
      <p>stuff</p>
    </div>

    <div class="container">
      <img alt="" class="game" onclick="location.href='./games/'" src="./homeimgs/folder.png" draggable="false">
      <img alt="" class="game" onclick="location.href='./emulators/'" src="./homeimgs/emulator.png" draggable="false">
      <img alt="" class="game" onclick="location.href='./chat/'" src="./homeimgs/chat.png" draggable="false">
      <img alt="SRC" class="game" onclick="location.href='./src/'" src="./homeimgs/3kh0.png" draggable="false">
      <img alt="Updates" class="game" onclick="location.href='./patch/'" src="./homeimgs/patch.png" draggable="false">
    </div>
  </div>

  <!-- Announcement overlay -->
  <div id="announcementOverlay">
    <div id="announcementBox">
      <h2 id="annTitle">Announcement</h2>
      <p id="annMessage">...</p>
      <button id="closeOverlay">Close</button>
    </div>
  </div>

  <script>
    // --------------------------
    // Generate user ID
    // --------------------------
    function generateUserId() {
      return Math.floor(1000000 + Math.random() * 9000000).toString();
    }

    let userId = localStorage.getItem('userId');
    if (!userId) {
      userId = generateUserId();
      localStorage.setItem('userId', userId);
    }

    console.log("Your ID:", userId);

    // --------------------------
    // Firebase init
    // --------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCnXJ7ViYIjukZjCQc2ZVM6TWRVik3YFsw",
      authDomain: "destpl-13f92.firebaseapp.com",
      databaseURL: "https://destpl-13f92-default-rtdb.firebaseio.com/",
      projectId: "destpl-13f92",
      appId: "1:550261346575:web:51a155990b214563f92e7a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --------------------------
    // Mark user online
    // --------------------------
    const userRef = db.ref('users/' + userId);
    userRef.set({ online: true, lastSeen: Date.now() });
    window.addEventListener('beforeunload', () => userRef.remove());
    setInterval(() => userRef.update({ lastSeen: Date.now() }), 30000);

    // --------------------------
    // Populate online users dropdown
    // --------------------------
    const targetSelect = document.getElementById('targetUser');
    if (targetSelect) {
      const usersRef = db.ref('users/');
      usersRef.on('value', snapshot => {
        const users = snapshot.val() || {};
        targetSelect.innerHTML = `<option value="">Select a user</option>`;
        for (const id in users) {
          if (id !== userId) {
            targetSelect.innerHTML += `<option value="${id}">${id}</option>`;
          }
        }
      });
    }

    // --------------------------
    // Announcement overlay logic - always on
    // --------------------------
    const overlay = document.getElementById('announcementOverlay');
    const titleEl = document.getElementById('annTitle');
    const msgEl = document.getElementById('annMessage');

    document.getElementById('closeOverlay').addEventListener('click', () => {
      overlay.classList.remove('show');
    });

    const currentRef = db.ref('announcements/current');
    currentRef.on('value', snapshot => {
      const data = snapshot.val();
      if (!data) return;

      titleEl.textContent = data.title || 'Announcement';
      msgEl.textContent = data.message || '';
      overlay.classList.add('show');

      if (data.durationSeconds && Number.isFinite(data.durationSeconds)) {
        setTimeout(() => overlay.classList.remove('show'), data.durationSeconds * 1000);
      }
    }, error => {
      console.error("Firebase read failed:", error);
    });

    const userAnnouncementsRef = db.ref(`announcements/users/${userId}`);
    userAnnouncementsRef.on('child_added', snapshot => {
      const data = snapshot.val();
      if (!data) return;

      titleEl.textContent = data.title || 'Announcement';
      msgEl.textContent = data.message || '';
      overlay.classList.add('show');

      if (data.durationSeconds && Number.isFinite(data.durationSeconds)) {
        setTimeout(() => overlay.classList.remove('show'), data.durationSeconds * 1000);
      }

      // Optionally remove the announcement after showing
      snapshot.ref.remove().catch(console.error);
    });

    //data saving
    // Save localStorage to Firebase under `userData/<userId>`
      function saveLocalStorageToFirebase() {
      const data = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        // skip keys that contain invalid Firebase characters
        if (!/[.#$/\[\]]/.test(key)) {
          data[key] = localStorage.getItem(key);
        }
      }
      return db.ref(`userData/${userId}`).set(data);
    }

    // Save every 30 seconds
    setInterval(saveLocalStorageToFirebase, 30000);

    // Save immediately on load
    saveLocalStorageToFirebase().catch(console.error);

    // updatedata + force refresh
    db.ref(`userCommands/${userId}/reload`).on('value', snapshot => {
    const cmd = snapshot.val();
    if (!cmd) return;

    db.ref(`userData/${userId}`).once('value').then(snap => {
      const data = snap.val() || {};
      for (let key in data) localStorage.setItem(key, data[key]);

      // clear the reload command so it doesn't trigger again
      db.ref(`userCommands/${userId}/reload`).remove();

      // refresh page
      location.reload();
    });
  });
  </script>
</body>
</html>
