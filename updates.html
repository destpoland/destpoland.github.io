<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Announcements & Screen View</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 900px; margin:auto; }
    input, select, textarea { width: 100%; padding: 8px; margin-bottom: 12px; border-radius: 4px; border: 1px solid #ccc; box-sizing:border-box; }
    button { padding: 10px 16px; border-radius: 6px; border: none; cursor: pointer; margin-right: 8px; }
    button.send { background-color: #2b6ef6; color: white; }
    button.clear { background-color: #f44336; color: white; }
    #loginForm { margin-bottom: 20px; }
    h2 { margin-top: 28px; }
    .section { margin-bottom: 18px; padding:12px; border-radius:8px; background:#fafafa; box-shadow:0 4px 18px rgba(0,0,0,0.04); }
    #viewerControls { display:flex; gap:8px; align-items:center; flex-wrap: wrap; }
    #remoteVideo { width:100%; max-height:500px; background:#000; }
    .small { font-size:0.9rem; color:#666; }
  </style>
</head>
<body>

<h1>Admin Panel</h1>

<!-- Simple password check for testing -->
<div id="loginForm" class="section">
  <input type="password" id="adminPass" placeholder="Enter admin password">
  <button id="loginBtn">Login</button>
  <div class="small">This login is client-side-only for testing. Use proper auth for production.</div>
</div>

<div id="adminUI" style="display:none;">
  <div class="section">
    <h2>Announcements</h2>
    <input id="title" placeholder="Announcement Title">
    <textarea id="message" placeholder="Announcement Message" rows="4"></textarea>
    <input id="duration" placeholder="Duration (seconds, optional)">
    <select id="announcementUser">
      <option value="">Send to all users</option>
    </select>
    <button class="send" id="sendBtn">Send Announcement</button>
    <button class="clear" id="clearBtn">Clear Announcement</button>
  </div>

  <div class="section">
    <h2>Screen Viewing (One-to-One)</h2>
    <div class="small">Select an online user to view their screen.</div>

    <div id="viewerControls">
      <select id="sessionDropdown">
        <option value="">Select user</option>
      </select>
      <button id="viewBtn">View Screen</button>
      <button id="stopViewBtn" style="display:none;background:#999;color:#fff;">Stop</button>
    </div>

    <div style="margin-top:12px;">
      <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <div id="viewerMsg" class="small" style="margin-top:8px;color:#b00;display:none"></div>
  </div>

  <div class="section">
    <h2>User Saved Data</h2>
    <select id="dataUserSelect">
      <option value="">Select user</option>
    </select>
    <button id="loadDataBtn">Load Data</button>
    <textarea id="userDataArea" rows="10" placeholder="User data will appear here..."></textarea>
    <button id="saveDataBtn">Save Changes</button>
  </div>
</div>


<script>
  // --------------------------
  // Firebase setup (compat)
  // --------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyCnXJ7ViYIjukZjCQc2ZVM6TWRVik3YFsw",
    authDomain: "destpl-13f92.firebaseapp.com",
    databaseURL: "https://destpl-13f92-default-rtdb.firebaseio.com/",
    projectId: "destpl-13f92",
    appId: "1:550261346575:web:51a155990b214563f92e7a"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // --------------------------
  // Admin login
  // --------------------------
  const PASSWORD_HASH = "f183407bca4c5905bae87bba88bc0714"; 
  const loginForm = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const adminUI = document.getElementById('adminUI');

  loginBtn.addEventListener('click', () => {
    const val = document.getElementById('adminPass').value || "";
    const hashedVal = CryptoJS.MD5(val).toString();
    if (hashedVal === PASSWORD_HASH) {
      loginForm.style.display = 'none';
      adminUI.style.display = 'block';
    } else {
      alert('Incorrect password.');
    }
  });

  // --------------------------
  // Announcements
  // --------------------------
  const sendBtn = document.getElementById('sendBtn');
  const clearBtn = document.getElementById('clearBtn');

  sendBtn.addEventListener('click', async () => {
  const title = document.getElementById('title').value.trim();
  const message = document.getElementById('message').value.trim();
  const duration = parseInt(document.getElementById('duration').value) || null;
  const targetUser = announcementUser.value; // optional user

  if (!message) return alert("Message cannot be empty.");

  const payload = { title, message, ts: Date.now() };
  if (duration) payload.durationSeconds = duration;

  try {
    if (targetUser) {
      // Send to a single user
      await db.ref(`announcements/users/${targetUser}`).push(payload);
    } else {
      // Send to everyone (current behavior)
      await db.ref('announcements/current').set(payload);
      await db.ref('announcements/logs').push(payload);
    }

    alert(targetUser ? `Announcement sent to user ${targetUser}!` : "Announcement sent to all!");
  } catch (err) {
    console.error(err);
    alert("Failed to send announcement.");
  }
});

  clearBtn.addEventListener('click', async () => {
    if (!confirm("Clear current announcement?")) return;
    try {
      await db.ref('announcements/current').remove();
      alert("Announcement cleared.");
    } catch (err) {
      console.error(err);
      alert("Failed to clear announcement.");
    }
  });

  // --------------------------
  // One-to-one screen viewer
  // --------------------------
  const sessionDropdown = document.getElementById('sessionDropdown');
  const viewBtn = document.getElementById('viewBtn');
  const stopViewBtn = document.getElementById('stopViewBtn');
  const remoteVideo = document.getElementById('remoteVideo');
  const viewerMsg = document.getElementById('viewerMsg');

  let pc = null;
  let currentSession = null;
  let callerCandidatesRef = null;
  let calleeCandidatesRef = null;
  let callerCandidatesListener = null;

  // Populate online users in dropdown
  db.ref('users/').on('value', snapshot => {
    const users = snapshot.val() || {};
    const localUserId = localStorage.getItem('userId');
    sessionDropdown.innerHTML = `<option value="">Select user</option>`;
    for (const id in users) {
      if (id !== localUserId) { 
        sessionDropdown.innerHTML += `<option value="${id}">${id}</option>`;
      }
    }
  });
  const announcementUser = document.getElementById('announcementUser');

  db.ref('users/').on('value', snapshot => {
    const users = snapshot.val() || {};
    const localUserId = localStorage.getItem('userId');

    // Populate sessionDropdown (screen viewing)
    sessionDropdown.innerHTML = `<option value="">Select user</option>`;
    for (const id in users) {
      if (id !== localUserId) {
        sessionDropdown.innerHTML += `<option value="${id}">${id}</option>`;
      }
    }

    // Populate announcementUser (optional targeting)
    announcementUser.innerHTML = `<option value="">Send to all users</option>`;
    for (const id in users) {
      if (id !== localUserId) {
        announcementUser.innerHTML += `<option value="${id}">${id}</option>`;
      }
    }
  });
  function resetViewerState() {
    if (pc) pc.close();
    pc = null;
    if (callerCandidatesRef && callerCandidatesListener) callerCandidatesRef.off('child_added', callerCandidatesListener);
    callerCandidatesRef = null;
    calleeCandidatesRef = null;
    currentSession = null;
    remoteVideo.srcObject = null;
    stopViewBtn.style.display = 'none';
    viewBtn.style.display = 'inline-block';
    viewerMsg.style.display = 'none';
  }

  viewBtn.addEventListener('click', async () => {
    const targetId = sessionDropdown.value;
    if (!targetId) return alert('Select a user to view!');
    currentSession = targetId;
    viewBtn.disabled = true;
    viewerMsg.style.display = 'none';

    try {
      pc = new RTCPeerConnection();

      pc.ontrack = e => { remoteVideo.srcObject = e.streams[0]; };

      // ICE candidates
      const localUserId = localStorage.getItem('userId');
      calleeCandidatesRef = db.ref(`screenshare/${targetId}_to_${localUserId}/calleeCandidates`);
      pc.onicecandidate = e => { if(e.candidate) calleeCandidatesRef.push(JSON.stringify(e.candidate)); };

      // Read offer
      const offerSnap = await db.ref(`screenshare/${targetId}_to_${localUserId}/offer`).once('value');
      const offer = JSON.parse(offerSnap.val());
      await pc.setRemoteDescription(offer);

      // Create answer
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await db.ref(`screenshare/${targetId}_to_${localUserId}/answer`).set(JSON.stringify(answer));

      // Listen for caller ICE candidates
      callerCandidatesRef = db.ref(`screenshare/${targetId}_to_${localUserId}/callerCandidates`);
      callerCandidatesListener = snap => {
        const val = snap.val();
        if (!val) return;
        pc.addIceCandidate(new RTCIceCandidate(JSON.parse(val))).catch(console.error);
      };
      callerCandidatesRef.on('child_added', callerCandidatesListener);

      stopViewBtn.style.display = 'inline-block';
      viewBtn.style.display = 'none';
    } catch (err) {
      console.error(err);
      viewerMsg.textContent = 'Failed to join session: ' + (err.message || err);
      viewerMsg.style.display = 'block';
      resetViewerState();
    } finally {
      viewBtn.disabled = false;
    }
  });

  stopViewBtn.addEventListener('click', async () => {
    try {
      if (currentSession) {
        const localUserId = localStorage.getItem('userId');
        await db.ref(`screenshare/${currentSession}_to_${localUserId}/calleeCandidates`).remove();
      }
    } catch(e){ console.error(e); }
    resetViewerState();
  });

  window.addEventListener('beforeunload', async () => {
    try {
      if (currentSession) {
        const localUserId = localStorage.getItem('userId');
        await db.ref(`screenshare/${currentSession}_to_${localUserId}/calleeCandidates`).remove();
      }
    } catch(e){}
  });

  // --------------------------
  // User data editor
  // --------------------------
  const dataUserSelect = document.getElementById('dataUserSelect');
  const loadDataBtn = document.getElementById('loadDataBtn');
  const saveDataBtn = document.getElementById('saveDataBtn');
  const userDataArea = document.getElementById('userDataArea');

  // Populate user dropdown
  db.ref('users/').on('value', snapshot => {
    const users = snapshot.val() || {};
    dataUserSelect.innerHTML = `<option value="">Select user</option>`;
    for (const id in users) {
      dataUserSelect.innerHTML += `<option value="${id}">${id}</option>`;
    }
  });

  let currentEditingUser = null;

  // Load selected user's saved data
  loadDataBtn.addEventListener('click', async () => {
    const selectedId = dataUserSelect.value;
    if (!selectedId) return alert("Select a user to load their data!");

    currentEditingUser = selectedId;

    try {
      const snapshot = await db.ref(`userData/${selectedId}`).once('value');
      const data = snapshot.val() || {};
      userDataArea.value = JSON.stringify(data, null, 2);
    } catch (err) {
      console.error(err);
      alert("Failed to load user data.");
    }
  });

  // Save edited data back to Firebase
  saveDataBtn.addEventListener('click', async () => {
    if (!currentEditingUser) return alert("No user loaded!");
    
    try {
      const parsed = JSON.parse(userDataArea.value);
      await db.ref(`userData/${currentEditingUser}`).set(parsed);
      await db.ref(`userCommands/${currentEditingUser}/reload`).set({ ts: Date.now() });
      alert("User data saved successfully!");
    } catch (err) {
      console.error(err);
      alert("Failed to save data. Make sure JSON is valid!");
    }
  });
</script>
<script>
  // Make sure Firebase is already initialized (db is defined)
  let userId = localStorage.getItem('userId');
  if (!userId) {
    userId = Math.floor(1000000 + Math.random() * 9000000).toString(); // random 7-digit ID
    localStorage.setItem('userId', userId);
  }

  const userRef = db.ref('users/' + userId);

  // Mark user online
  userRef.set({ online: true, lastSeen: Date.now() });

  // Remove user from list on tab close
  window.addEventListener('beforeunload', () => {
    userRef.remove();
  });

  // Optional: keep lastSeen updated every 30 seconds
  setInterval(() => {
    userRef.update({ lastSeen: Date.now() });
  }, 30000);
</script>
</body>
</html>
